# EzBoost Storage Configuration
# Controls which database backend is used to persist player boost state and cooldowns.
#
# Available backends:
#   yaml        - Flat YAML files in the plugin data folder (default, no setup required)
#   sqlite      - SQLite database file (no server required, single-file DB)
#   mysql       - MySQL 5.7+ / MySQL 8
#   mariadb     - MariaDB 10.3+
#   postgresql  - PostgreSQL 12+
#   h2          - H2 embedded database (primarily for testing)
#
# For MySQL, MariaDB and PostgreSQL the JDBC driver JAR must be present on the server
# classpath (e.g. drop the driver JAR into the server root or /lib folder).

storage:
  backend: yaml

  # ── SQLite ──────────────────────────────────────────────────────────────────
  # File path relative to the EzBoost plugin data folder.
  sqlite:
    file: ezboost.db

  # ── MySQL / MariaDB ─────────────────────────────────────────────────────────
  mysql:
    host: localhost
    port: 3306
    database: ezboost
    username: root
    password: ""
    pool-size: 10

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgresql:
    host: localhost
    port: 5432
    database: ezboost
    username: postgres
    password: ""
    pool-size: 10

  # ── H2 (embedded, mainly for testing) ───────────────────────────────────────
  h2:
    file: ezboost
