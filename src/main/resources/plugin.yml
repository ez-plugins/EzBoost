name: EzBoost
version: ${project.version}
main: com.skyblockexp.ezboost.EzBoostPlugin
api-version: '1.21'
folia-supported: true
softdepend: [Vault, EzEconomy, WorldGuard, EzShops]
author: SkyblockExperience
commands:
  boost:
    description: Open the boosts GUI, show info, or activate a boost.
    usage: /boost [about|top|boostKey]
    permission: ezboost.use
  boosttop:
    description: View the top boost buyers leaderboard.
    usage: /boosttop
    permission: ezboost.top
  ezboost:
    description: EzBoost administration commands.
    usage: /ezboost <about|reload|give|create|stats> [args]
    permission: ezboost.admin
permissions:
  ezboost.use:
    description: Use boosts.
    default: true
  ezboost.admin:
    description: Manage EzBoost.
    default: op
  ezboost.reload:
    description: Reload EzBoost configuration.
    default: op
  ezboost.give:
    description: Give boost tokens.
    default: op
  ezboost.cooldown.bypass:
    description: Bypass boost cooldowns.
    default: op
  ezboost.top:
    description: View the boost top leaderboard.
    default: true
  ezboost.stats:
    description: View your own boost stats.
    default: true
