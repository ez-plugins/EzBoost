settings:
  replace-active-boost: false
  refund-on-fail: true
  keep-boost-on-death: true
  reapply-on-join: true
  send-expired-message: true
  cooldown-per-boost-type: true
  # When true, cooldowns are tracked per-effect (including custom effects).
  # Effect-specific cooldowns use the effect's canonical key; lookups fall back
  # to the boost-level/global cooldown when no effect-specific cooldown exists.
  cooldown-per-effect: false
