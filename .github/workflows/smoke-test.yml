name: Smoke Test

# Verify EzBoost starts cleanly on Paper 26.1.2, Spigot 1.21.4, and
# CraftBukkit 1.21.11 for every PR targeting main.
# The plugin is compiled with Java 25; all servers are run on Java 25.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PAPER_261_VERSION: "26.1.2"  # New MC versioning scheme; uses fill.papermc.io API
  SPIGOT_VERSION: "1.21.11"
  BUKKIT_VERSION: "1.21.11"

jobs:
  # ── 1. Build the shaded plugin JAR once with JDK 25 ────────────────────────
  build:
    name: Build plugin JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Build plugin (skip tests)
        run: mvn clean package -B -DskipTests -q

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          # Exclude the pre-shade original-*.jar created by maven-shade-plugin
          path: |
            target/EzBoost-*.jar
            !target/original-EzBoost-*.jar
          if-no-files-found: error
          retention-days: 1

  # ── 2. Matrix smoke test: Paper, Spigot, Bukkit (CraftBukkit) ──────────────
  smoke:
    name: "${{ matrix.server }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [paper, spigot, bukkit]

    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: plugin

      - name: Locate plugin JAR
        id: jar
        run: |
          JAR=$(ls plugin/*.jar | grep -v 'original-' | head -1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Using JAR: $JAR"

      # ── Paper 26.1.2 (new MC versioning; uses fill.papermc.io) ────────────
      - name: Download Paper ${{ env.PAPER_261_VERSION }}
        if: matrix.server == 'paper'
        run: |
          URL=$(curl -sf \
            "https://fill.papermc.io/v3/projects/paper/versions/${PAPER_261_VERSION}/builds" \
            | jq -r 'map(select(.channel == "STABLE")) | first | .downloads["server:default"].url')
          curl -sfLo server.jar "$URL"
          echo "Paper 26.1.2 URL: $URL"

      # ── Spigot (built via BuildTools; result cached by Spigot version) ─────
      # BuildTools is strict about its build JVM; use Java 21 to compile
      # Spigot, then restore Java 25 so the plugin runs on the correct JVM.
      - name: Set up Java 21 for Spigot BuildTools
        if: matrix.server == 'spigot'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Spigot ${{ env.SPIGOT_VERSION }}
        if: matrix.server == 'spigot'
        id: spigot-cache
        uses: actions/cache@v4
        with:
          path: ~/spigot-jar
          key: spigot-${{ env.SPIGOT_VERSION }}-buildtools-v1

      - name: Build Spigot via BuildTools
        if: matrix.server == 'spigot' && steps.spigot-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          mkdir -p ~/spigot-jar buildtools
          cd buildtools
          curl -sfLo BuildTools.jar \
            "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar"
          "$JAVA_HOME_21_X64/bin/java" -jar BuildTools.jar --rev "$SPIGOT_VERSION" --nogui
          cp "spigot-${SPIGOT_VERSION}.jar" "$HOME/spigot-jar/"

      - name: Restore Java 25 for Spigot smoke test
        if: matrix.server == 'spigot'
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Use Spigot JAR
        if: matrix.server == 'spigot'
        run: cp "$HOME/spigot-jar/spigot-${SPIGOT_VERSION}.jar" server.jar

      # ── CraftBukkit (built via BuildTools; result cached by version) ───────
      # Same BuildTools pattern as Spigot: compile with Java 21, run with 25.
      - name: Set up Java 21 for CraftBukkit BuildTools
        if: matrix.server == 'bukkit'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache CraftBukkit ${{ env.BUKKIT_VERSION }}
        if: matrix.server == 'bukkit'
        id: bukkit-cache
        uses: actions/cache@v4
        with:
          path: ~/bukkit-jar
          key: craftbukkit-${{ env.BUKKIT_VERSION }}-buildtools-v1

      - name: Build CraftBukkit via BuildTools
        if: matrix.server == 'bukkit' && steps.bukkit-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          mkdir -p ~/bukkit-jar buildtools
          cd buildtools
          curl -sfLo BuildTools.jar \
            "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar"
          "$JAVA_HOME_21_X64/bin/java" -jar BuildTools.jar --rev "$BUKKIT_VERSION" --compile craftbukkit --nogui
          cp "craftbukkit-${BUKKIT_VERSION}.jar" "$HOME/bukkit-jar/"

      - name: Restore Java 25 for CraftBukkit smoke test
        if: matrix.server == 'bukkit'
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Use CraftBukkit JAR
        if: matrix.server == 'bukkit'
        run: cp "$HOME/bukkit-jar/craftbukkit-${BUKKIT_VERSION}.jar" server.jar

      # ── Smoke test ─────────────────────────────────────────────────────────
      - name: Run smoke test
        timeout-minutes: 5
        run: |
          mkdir -p server/plugins
          cp "${{ steps.jar.outputs.path }}" server/plugins/

          # Pre-accept EULA and disable online-mode so the server doesn't
          # contact Mojang auth services during the headless startup check.
          printf 'eula=true\n'         > server/eula.txt
          printf 'online-mode=false\n' > server/server.properties

          cd server
          java -Xmx512M -Xms256M -jar ../server.jar --nogui \
            < /dev/null > server.log 2>&1 &
          SERVER_PID=$!

          echo "Started PID=$SERVER_PID  server=${{ matrix.server }}"

          # Poll up to 120 s for a conclusive result
          FAIL_PAT="NoSuchMethodError|NoSuchFieldError|Error enabling plugin EzBoost|Error occurred while enabling EzBoost"
          RESULT=timeout
          for i in $(seq 1 120); do
            sleep 1
            # Hard failures — API incompatibility or onEnable exception
            if grep -qE "$FAIL_PAT" server.log 2>/dev/null; then
              RESULT=fail
              break
            fi
            # Server fully started → all plugins have been enabled without errors.
            # "Done (" is more reliable than checking "Enabling EzBoost" because
            # some server variants (e.g. Paper 26.1) load worlds before enabling
            # plugins, so "Enabling" can appear late.
            if grep -qE "Done \([0-9.]" server.log 2>/dev/null; then
              if grep -qE "$FAIL_PAT" server.log 2>/dev/null; then
                RESULT=fail
              else
                RESULT=pass
              fi
              break
            fi
            # "Enabling" logged — wait 5 more seconds for any delayed crash
            # before declaring pass.
            if grep -q "Enabling EzBoost" server.log 2>/dev/null; then
              sleep 5
              if grep -qE "$FAIL_PAT" server.log 2>/dev/null; then
                RESULT=fail
              else
                RESULT=pass
              fi
              break
            fi
          done

          # SIGKILL guarantees the JVM exits immediately — SIGTERM can block for
          # minutes on servers mid-way through world saves or chunk generation.
          kill -9 "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

          echo ""
          echo "=== Error context in server.log ==="
          grep -n -B1 -A25 -E "Error occurred while enabling|Error enabling plugin|NoSuchMethodError|NoSuchFieldError" server.log | head -80 || true
          echo ""
          echo "=== Last 100 lines of server.log ==="
          tail -100 server.log
          echo "====================================="
          echo ""

          if [ "$RESULT" = "pass" ]; then
            echo "PASS: EzBoost enabled on ${{ matrix.server }}"
          elif [ "$RESULT" = "fail" ]; then
            echo "FAIL: Plugin threw an error during startup"
            exit 1
          else
            echo "FAIL: Timed out — EzBoost never appeared in server.log within 120 s"
            exit 1
          fi
